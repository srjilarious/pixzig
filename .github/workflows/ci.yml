name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the 0.17.0 release (matches build.zig.zon's
      # minimum_zig_version).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # The unit tests create a real GL 4.5 core context (tests/main.zig's
      # GlTestContext), so the runner needs an EGL loader and Mesa's software
      # rasterizer. SDL's dummy video driver has no GL at all, so the
      # offscreen driver below is what makes this work without a display.
      - name: Install Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libegl-mesa0 libgl1-mesa-dri libgbm1

      # Runs first: it builds far less than build-all, so a broken test
      # reports quickly. testz exits non-zero on a failing test as of 1.7.0.
      - name: Run unit tests
        env:
          SDL_VIDEODRIVER: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: zig build tests

      # Nothing else compiles the examples, so without this they can rot
      # unnoticed while the engine changes around them.
      - name: Build all examples
        run: zig build build-all

      # `zig build new` copies template/, so it has to keep building against
      # the engine (and through buildGame, the way a real game does).
      - name: Build the project template
        working-directory: template
        run: zig build

  # Compile-only Android build: every example's APK for arm64, no emulator.
  # Catches engine changes that break the Android target (bionic, GLES,
  # SDL's Java glue) without needing a device. The runner image ships the
  # Android SDK and NDK ($ANDROID_HOME, $ANDROID_NDK_HOME) and a JDK.
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The APKs are signed with the debug key, which only Android Studio
      # creates; make a throwaway one.
      - name: Create a debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -validity 10000

      - name: Build every example's APK
        run: zig build install -Dtarget=aarch64-linux-android
