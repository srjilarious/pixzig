[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixzig"
dynamic = ["version"]
description = "Python bindings for the pixzig game engine"
requires-python = ">=3.9"
license = "MIT"
readme = "README.md"
keywords = ["game", "gamedev", "2d", "engine", "sdl", "opengl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/srjilarious/pixzig"
Documentation = "https://www.walknsqualk.com/pixzig/page/python.html"
Source = "https://github.com/srjilarious/pixzig"
Issues = "https://github.com/srjilarious/pixzig/issues"

[tool.setuptools.dynamic]
# Populated at build time from build.zig.zon's own .version field (the
# engine's version is the single source of truth) -- see VERSION.md note in
# build_wheels.py and .github/workflows/python-wheels.yml. Not read via
# {attr = "pixzig.__version__"}: that would make setuptools import pixzig
# during the build, which loads the native library via ctypes at import
# time -- fatal when cross-building the Windows wheel on a Linux runner.
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["."]
include = ["pixzig*"]

[tool.setuptools.package-data]
pixzig = ["*.so", "*.dll"]
